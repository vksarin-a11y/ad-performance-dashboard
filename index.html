<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F6F3;
    --paper-raised: #FFFFFF;
    --ink: #1B1D1F;
    --ink-soft: #5C5F63;
    --hairline: #DEDDD6;
    --accent: #2C6E8E;
    --accent-soft: #E3EEF2;
    --warn: #C97A2B;
    --warn-soft: #FBF0E4;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper: #17181A;
      --paper-raised: #1F2123;
      --ink: #EDEDEA;
      --ink-soft: #9A9C9F;
      --hairline: #33353A;
      --accent: #7FB9D4;
      --accent-soft: #223842;
      --warn: #E0A45E;
      --warn-soft: #3A2E1C;
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px 96px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subhead{color:var(--ink-soft);font-size:14px;margin:0 0 40px;}
  .subhead span{font-family:'IBM Plex Mono', monospace;}

  .totals{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--hairline);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:48px;
  }
  .totals .cell{background:var(--paper-raised);padding:18px 20px;}
  .totals .label{
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .totals .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:22px;
    font-weight:500;
  }

  .manager-group{margin-bottom:36px;}
  .manager-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:1px solid var(--hairline);
    padding-bottom:8px;
    margin-bottom:2px;
  }
  .manager-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:16px;
  }
  .manager-total{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
  }

  .account-row{
    display:grid;
    grid-template-columns: 1.6fr 0.9fr 0.9fr 0.9fr 0.9fr 1.2fr;
    align-items:center;
    gap:12px;
    padding:14px 4px;
    border-bottom:1px solid var(--hairline);
  }
  .account-row:last-child{border-bottom:none;}
  .account-name{font-weight:500;font-size:14px;}
  .account-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .metric{font-family:'IBM Plex Mono', monospace;font-size:13px;text-align:right;}
  .metric .m-label{
    display:block;
    font-family:'Inter', sans-serif;
    font-size:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:2px;
    text-align:right;
  }

  .badges{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
  .badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    padding:3px 8px;
    border-radius:100px;
    white-space:nowrap;
  }
  .badge.on{background:var(--accent-soft);color:var(--accent);}
  .badge.off{background:var(--warn-soft);color:var(--warn);}

  .empty-state{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .spend-bar{
    height:3px;
    background:var(--hairline);
    border-radius:2px;
    margin-top:8px;
    overflow:hidden;
  }
  .spend-bar-fill{height:100%;background:var(--accent);}

  footer{
    margin-top:56px;
    padding-top:20px;
    border-top:1px solid var(--hairline);
    font-size:12px;
    color:var(--ink-soft);
  }

  @media (max-width: 720px){
    .totals{grid-template-columns:repeat(2,1fr);}
    .account-row{grid-template-columns:1fr;gap:6px;}
    .metric{text-align:left;}
    .metric .m-label{text-align:left;}
    .badges{justify-content:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Live account ledger</p>
  <h1>Ad account performance</h1>
  <p class="subhead">Auto-updated from Google Ads Scripts &middot; last refreshed <span id="last-updated">—</span></p>

  <div class="totals" id="totals"></div>
  <div id="managers"></div>

  <footer>
    Data source: Google Ads (live). Meta not yet connected for accounts marked <span class="badge off" style="display:inline;">meta off</span> — add a Meta feed and its badge will flip automatically, no code changes needed.
  </footer>
</div>

<script>
async function loadDashboard(){
  const managersEl = document.getElementById('managers');
  const totalsEl = document.getElementById('totals');

  let manifest;
  try{
    const res = await fetch('data/accounts.json');
    manifest = await res.json();
  }catch(e){
    managersEl.innerHTML = '<p class="empty-state">Could not load data/accounts.json — check the file exists and is valid JSON.</p>';
    return;
  }

  const accounts = await Promise.all(manifest.accounts.map(async (acc) => {
    const google = acc.google_ads_id ? await tryFetch(`data/google_ads_${acc.google_ads_id}.json`) : null;
    const meta = acc.meta_ad_account_id ? await tryFetch(`data/meta_${acc.meta_ad_account_id}.json`) : null;
    return { ...acc, google, meta };
  }));

  renderTotals(accounts, totalsEl);
  renderManagerGroups(accounts, managersEl);
  setLastUpdated(accounts);
}

async function tryFetch(path){
  try{
    const res = await fetch(path, { cache: 'no-store' });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;
  }
}

function renderTotals(accounts, el){
  const totals = accounts.reduce((sum, a) => {
    if(a.google && a.google.metrics){
      sum.spend += a.google.metrics.spend || 0;
      sum.clicks += a.google.metrics.clicks || 0;
      sum.conversions += a.google.metrics.conversions || 0;
    }
    return sum;
  }, { spend: 0, clicks: 0, conversions: 0 });

  const connected = accounts.filter(a => a.google).length;

  el.innerHTML = `
    <div class="cell"><div class="label">Total spend (7d)</div><div class="value">$${fmt(totals.spend)}</div></div>
    <div class="cell"><div class="label">Total clicks</div><div class="value">${fmt(totals.clicks, 0)}</div></div>
    <div class="cell"><div class="label">Total conversions</div><div class="value">${fmt(totals.conversions, 0)}</div></div>
    <div class="cell"><div class="label">Accounts reporting</div><div class="value">${connected} / ${accounts.length}</div></div>
  `;
}

function renderManagerGroups(accounts, el){
  const byManager = {};
  accounts.forEach(a => {
    (byManager[a.manager] = byManager[a.manager] || []).push(a);
  });

  const maxSpend = Math.max(1, ...accounts.map(a => (a.google && a.google.metrics.spend) || 0));

  el.innerHTML = Object.entries(byManager).map(([manager, accs]) => {
    const managerTotal = accs.reduce((s, a) => s + ((a.google && a.google.metrics.spend) || 0), 0);
    const rows = accs.map(a => accountRow(a, maxSpend)).join('');
    return `
      <div class="manager-group">
        <div class="manager-header">
          <div class="manager-name">${escapeHtml(manager)}</div>
          <div class="manager-total">$${fmt(managerTotal)} managed</div>
        </div>
        ${rows}
      </div>
    `;
  }).join('');
}

function accountRow(a, maxSpend){
  const g = a.google && a.google.metrics;
  const spendPct = g ? Math.round((g.spend / maxSpend) * 100) : 0;

  if(!g){
    return `
      <div class="account-row">
        <div>
          <div class="account-name">${escapeHtml(a.name)}</div>
          <div class="account-meta">No Google Ads data yet</div>
        </div>
        <div class="metric" style="grid-column: span 4;"><span class="empty-state">Waiting for first script run</span></div>
        <div class="badges">
          <span class="badge off">google off</span>
          <span class="badge ${a.meta_ad_account_id ? 'off' : 'off'}">meta off</span>
        </div>
      </div>
    `;
  }

  return `
    <div class="account-row">
      <div>
        <div class="account-name">${escapeHtml(a.name)}</div>
        <div class="account-meta">${a.google.date_range.replace(/_/g,' ').toLowerCase()}</div>
        <div class="spend-bar"><div class="spend-bar-fill" style="width:${spendPct}%"></div></div>
      </div>
      <div class="metric"><span class="m-label">Spend</span>$${fmt(g.spend)}</div>
      <div class="metric"><span class="m-label">Impr.</span>${fmt(g.impressions, 0)}</div>
      <div class="metric"><span class="m-label">Clicks</span>${fmt(g.clicks, 0)}</div>
      <div class="metric"><span class="m-label">Conv.</span>${fmt(g.conversions, 0)}</div>
      <div class="badges">
        <span class="badge on">google on</span>
        <span class="badge ${a.meta ? 'on' : 'off'}">meta ${a.meta ? 'on' : 'off'}</span>
      </div>
    </div>
  `;
}

function setLastUpdated(accounts){
  const dates = accounts.map(a => a.google && a.google.updated_at).filter(Boolean).sort();
  const el = document.getElementById('last-updated');
  if(dates.length){
    const d = new Date(dates[dates.length - 1]);
    el.textContent = d.toLocaleString();
  } else {
    el.textContent = 'no data yet';
  }
}

function fmt(n, decimals = 2){
  return Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}
function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

loadDashboard();
</script>
</body>
</html>
